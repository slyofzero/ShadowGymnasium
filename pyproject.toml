[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-fight-2-rl"
version = "0.1.0"
description = "Shadow Fight 2 Reinforcement Learning & Modding Harness"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ishan" }]
dependencies = [
    "frida>=16.0.0",
    "paramiko>=5.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sf2-env = "rl_env.shadow_fight_env:main"
sf2-frida = "scripts.start_frida_service:main"
sf2-actions = "scripts.game_actions:main"
sf2-tick = "scripts.tick_controller:main"
sf2-telemetry = "scripts.stream_telemetry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_env*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    ".git",
    "modding/tools/Il2CppDumper",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long
    "E701", # multiple statements on one line (used in disassembly sign extensions)
    "E402", # module level import not at top of file (sys.path bootstrapping)
    "B008", # do not perform function calls in argument defaults
    "B905", # zip without strict
]

