<svg width="100%" height="100%" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="30%" stop-color="#12151D" />
      <stop offset="60%" stop-color="#261019" />
      <stop offset="85%" stop-color="#5C1625" />
      <stop offset="100%" stop-color="#A81D32" />
    </linearGradient>

    <!-- Waving Flow Gradients -->
    <linearGradient id="wave-1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141722" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7A182D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E63946" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="wave-2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0E14" stop-opacity="0" />
      <stop offset="40%" stop-color="#4A121E" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#E63946" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF5A67" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="600" y1="0" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D5E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08090C" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="katana-slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#FF8A95" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="65%" stop-color="#E63946" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E63946" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-title" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    <filter id="glow-title" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 40px;
      font-weight: 900;
      fill: #FFFFFF;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .badge-bg {
      fill: #1A0D12;
      stroke: #E63946;
      stroke-width: 1.2;
      rx: 6px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      fill: #FF5A67;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #E2E8F0;
      letter-spacing: 1px;
    }
    .subtagline {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 12.5px;
      font-weight: 500;
      fill: #FFA8B0;
      letter-spacing: 0.5px;
    }
    .grid-line {
      stroke: #FFFFFF;
      stroke-opacity: 0.03;
      stroke-width: 1;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="240" fill="url(#bg-grad)" />

  <!-- Background Decorative Grid -->
  <line x1="100" y1="0" x2="100" y2="240" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="240" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="240" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="240" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="240" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="240" class="grid-line" />
  <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
  <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />

  <!-- Radial Glow on upper right -->
  <ellipse cx="1000" cy="40" rx="350" ry="160" fill="url(#glow-grad)" />

  <!-- Layered Waves -->
  <path d="M0,130 C200,160 400,100 650,150 C900,200 1050,130 1200,160 L1200,240 L0,240 Z" fill="url(#wave-1)" />
  <path d="M0,170 C250,210 500,140 750,180 C950,210 1100,160 1200,185 L1200,240 L0,240 Z" fill="url(#wave-2)" />

  <!-- Katana Slash Accent -->
  <path d="M780,18 L1140,222" stroke="url(#katana-slash)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M790,26 L1130,218" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

  <!-- Content Group (Centered & Aligned) -->
  <g transform="translate(600, 115)">
    <!-- Badge -->
    <g transform="translate(-160, -78)">
      <rect width="320" height="24" class="badge-bg" />
      <text x="160" y="16" text-anchor="middle" class="badge-text">REINFORCEMENT LEARNING &amp; MODDING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-8" text-anchor="middle" class="title-main" filter="url(#shadow-title)">SHADOW FIGHT 2</text>

    <!-- Tagline -->
    <text x="0" y="32" text-anchor="middle" class="tagline">Autonomous In-Engine Instrumentation • Native IL2CPP Interception • Gymnasium Runtime</text>

    <!-- Subtitle / Terminal hint -->
    <text x="0" y="62" text-anchor="middle" class="subtagline">[ BlueStacks 5 • Frida Gadget • Sub-Millisecond Direct Memory Telemetry ]</text>
  </g>
</svg>
